<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Моё приложение</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .app {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        #user-info {
            color: #666;
            margin-bottom: 30px;
            font-size: 18px;
        }
        
        button {
            background: #0088cc;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            font-weight: 600;
        }
        
        button:hover {
            background: #006699;
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>🚀 Моё Mini App</h1>
        <p id="user-info">Загрузка...</p>
        <button id="action-btn">Нажми меня</button>
    </div>

    <!-- Telegram Web Apps SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram?.WebApp;
        
        if (tg) {
            // Расширить приложение на весь экран
            tg.expand();
            
            // Указать, что приложение готово
            tg.ready();
            
            // Получить данные пользователя
            const user = tg.initDataUnsafe?.user;
            
            if (user) {
                document.getElementById('user-info').textContent = 
                    `Привет, ${user.first_name}! 👋`;
            } else {
                document.getElementById('user-info').textContent = 
                    'Работаем в Telegram!';
            }
            
            // Настроить кнопку
            document.getElementById('action-btn').addEventListener('click', () => {
                tg.showAlert('Отлично! Кнопка работает! 🎉');
                
                // Отправить данные обратно боту
                tg.sendData(JSON.stringify({
                    action: 'button_clicked',
                    user_id: user?.id,
                    timestamp: Date.now()
                }));
            });
            
            // Настроить главную кнопку внизу
            tg.MainButton.text = 'Закрыть';
            tg.MainButton.show();
            tg.MainButton.onClick(() => tg.close());
        } else {
            document.getElementById('user-info').textContent = 
                'Откройте это приложение в Telegram!';
        }
    </script>
</body>
</html>
